packages:
  - "payload"
  - "website"

overrides:
  "@vitejs/plugin-vue": "^6.0.7"
  # dedupe picked the 2.0.0-beta for @astrojs/check's wasm peers; its bridge crashes astro check on exit
  "@emnapi/core": "1.11.3"
  "@emnapi/runtime": "1.11.3"

allowBuilds:
  "@infisical/cli": true
  "@parcel/watcher": true
  "@sentry/cli": true
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "@felix_berlin/*"
  - astro-breadcrumbs
  - astro-matomo
  - js-yaml

patchedDependencies:
  de-compromise: patches/de-compromise.patch
