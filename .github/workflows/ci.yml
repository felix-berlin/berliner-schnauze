name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Repo default is write; this job only reads code plus uploads a lint report,
# so scope it down to exactly that.
permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout ✅
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm 🛠️
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup Node.js 🔧
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # oxlint runs type-aware and vue-tsc/astro check need Astro's generated
      # types (astro:env/*, content collections) and the supportedBrowsers.mjs
      # stub the app imports — neither needs real secrets, just the schema.
      - name: Generate Astro types
        run: |
          pnpm run supportedBrowsers
          pnpm exec astro sync

      # Runs before the fixing `pnpm run lint` below so the report reflects
      # the actual pre-fix findings, not whatever's left after autofix.
      - name: Generate lint report (SARIF)
        if: ${{ !cancelled() }}
        run: pnpm run lint:report:sarif

      - name: Upload lint report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oxlint-report
          path: website/oxlint-results.sarif

      - name: Upload lint report to code scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: website/oxlint-results.sarif

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typechecking
