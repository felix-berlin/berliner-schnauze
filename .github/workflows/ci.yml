name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Repo default is write; this job only reads code plus uploads a lint report,
# so scope it down to exactly that.
permissions:
  contents: read
  security-events: write

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ✅
        uses: actions/checkout@v7

      - name: Setup pnpm 🛠️
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # oxlint runs type-aware and vue-tsc/astro check need Astro's generated
      # types (astro:env/*, content collections) and the supportedBrowsers.mjs
      # stub the app imports — neither needs real secrets, just the schema.
      - name: Generate Astro types
        run: |
          pnpm run supportedBrowsers
          pnpm exec astro sync

      # Runs before the fixing `pnpm run lint` below so the report reflects
      # the actual pre-fix findings, not whatever's left after autofix.
      - name: Generate lint report (SARIF)
        if: ${{ !cancelled() }}
        run: pnpm run lint:report:sarif

      - name: Upload lint report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: oxlint-report
          path: oxlint-results.sarif

      - name: Upload lint report to code scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: oxlint-results.sarif

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typechecking
