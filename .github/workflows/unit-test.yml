name: Unit tests
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "openspec/**"
  push:
    branches:
      - main
      - beta
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "openspec/**"

permissions:
  id-token: write
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Run unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout ✅
        uses: actions/checkout@v7

      - name: Fetch secrets from Infisical 🔐
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: "oidc"
          identity-id: "5f0ad8b7-0224-48ca-b233-abbd59f2eb68"
          project-slug: "berliner-schnauze"
          env-slug: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
          domain: "https://infisical.kasimir.dev"

      - name: Setup pnpm 🛠️
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies 🛠️
        run: pnpm install --frozen-lockfile

      - name: Run Vitest (with coverage report) 🧪
        run: pnpm run test:ci

      - name: Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          directory: ./website/tests/unit/coverage
        env:
          CODECOV_TOKEN: ${{ env.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          files: ./website/tests/unit/junit-report.xml
          token: ${{ env.CODECOV_TOKEN }}
        env:
          CODECOV_TOKEN: ${{ env.CODECOV_TOKEN }}

      # Fork PRs get a read-only GITHUB_TOKEN, so this check-run publish step
      # only takes effect on branch pushes/same-repo PRs — permissions above
      # can't grant more than that.
      - name: Publish test results as GitHub check
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Vitest results
          path: website/tests/unit/junit-report.xml
          reporter: java-junit

      - name: Upload test results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-results
          path: |
            website/tests/unit/junit-report.xml
            website/tests/unit/coverage

  cms-test:
    name: Run CMS tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Throwaway CI database: no Infisical, dummy values only.
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/cms_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cms_test
      PAYLOAD_SECRET: ci-dummy-secret
      PAYLOAD_SERVER_URL: http://localhost:3001

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout ✅
        uses: actions/checkout@v7

      - name: Setup pnpm 🛠️
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies 🛠️
        run: pnpm install --frozen-lockfile

      - name: Run CMS tests 🧪
        run: pnpm --filter payload-app test

      # migrate:create diffs the config against the last committed migration
      # snapshot; --skip-empty writes nothing when they match.
      - name: Check migrations match the schema 🗄️
        run: |
          pnpm --filter payload-app payload migrate:create schema-drift --skip-empty
          if [ -n "$(git status --porcelain -- payload/src/migrations)" ]; then
            git status --porcelain -- payload/src/migrations
            echo "::error::Schema changed without a migration. Run: pnpm --filter payload-app payload migrate:create <name>"
            exit 1
          fi

  # A deploy applies only the new migrations to a database that already holds rows. cms-test and docker-smoke start
  # from an empty database, so this job migrates with the base branch's code, seeds, upgrades with the PR and rolls back.
  migration-upgrade:
    name: Migration upgrade test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bs_upgrade_e2e
      PAYLOAD_SECRET: ci-dummy-secret

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bs_upgrade_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bs_upgrade_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout ✅
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm 🛠️
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies 🛠️
        run: pnpm install --frozen-lockfile

      - name: Upgrade from the base branch 🗄️
        run: scripts/migration-upgrade-test.sh "origin/${{ github.base_ref }}"
