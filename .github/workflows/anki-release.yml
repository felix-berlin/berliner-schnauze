name: Anki Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    name: Build & publish Anki decks
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ✅
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch secrets from Infisical 🔐
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: "oidc"
          identity-id: "5f0ad8b7-0224-48ca-b233-abbd59f2eb68"
          project-slug: "berliner-schnauze"
          env-slug: "prod"
          domain: "https://infisical.kasimir.dev"

      - name: Setup Python 🛠️
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: scripts/requirements-anki.txt

      - name: Install deck-build dependencies
        run: pip install -r scripts/requirements-anki.txt

      - name: Build decks 🏗️
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: python scripts/build_anki_decks.py --version "${VERSION#v}"

      - name: Attach Lite deck to the GitHub Release 📎
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.release.tag_name }}
        run: gh release upload "$VERSION" dist-anki/*-Lite-*.apkg --clobber

      - name: Upload Full deck to Polar 📦
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: python scripts/upload_anki_to_polar.py --version "${VERSION#v}"
