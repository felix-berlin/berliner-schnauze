name: Playwright Tests
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "openspec/**"
  # Every PR, whatever its base: stacked PRs need e2e + docker smoke too.
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "openspec/**"

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout ✅
        uses: actions/checkout@v7

      - name: Fetch secrets from Infisical 🔐
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: "oidc"
          identity-id: "5f0ad8b7-0224-48ca-b233-abbd59f2eb68"
          project-slug: "berliner-schnauze"
          env-slug: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
          domain: "https://infisical.kasimir.dev"

      - name: Setup pnpm 🛠️
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # the images run this major (dist/ is built here)
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Built explicitly here (rather than inside webServer.command) so the build has the full job timeout.
      # The build reads no database: pages render on demand, the shards below start the server against a
      # seeded Postgres. E2E_BUILD only skips the Sentry/Codecov source-map upload plugins, which add real
      # time for a build nobody deploys (see astro.config.mjs's isE2eBuild).
      - name: Build site
        env:
          E2E_BUILD: "1"
        run: pnpm run build

      # dist/ is served by `node server/index.mjs` in every shard job. Same public-repo
      # caveat as the report below: the build holds no secrets, only public HTML/JS.
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: website/dist
          retention-days: 1

  # Builds the production image from the same dist/ the e2e shards use and
  # checks routing, _headers/_redirects and caching in the running container.
  docker-smoke:
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ✅
        uses: actions/checkout@v7

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: website/dist

      # The script migrates and seeds a throwaway Postgres with the payload-app package.
      - name: Setup pnpm 🛠️
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Docker smoke test 🐳
        run: website/scripts/docker-smoke.sh

      - name: Setup Docker Buildx 🛠️
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Release builds and pushes this image after tagging: a broken payload/Dockerfile must fail the PR instead.
      # Reads the release's layer cache (main's scope is visible to PRs); writes none.
      - name: Build CMS image 🐳
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: payload/Dockerfile
          push: false
          cache-from: type=gha,scope=cms

  test:
    needs: build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Browsers + OS libs are baked into the image. Keep the tag in sync with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # --init reaps zombie browser/server processes; without it the run hangs after the last test.
      options: --init --ipc=host
    # GitHub sets HOME=/github/home in container jobs; Firefox/WebKit refuse to start
    # as root unless HOME is root's own home.
    env:
      HOME: /root
    defaults:
      run:
        working-directory: website
    # The server renders from this database; it is migrated and seeded with invented words below.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bs_e2e
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d bs_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout ✅
        uses: actions/checkout@v7

      - name: Fetch secrets from Infisical 🔐
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: "oidc"
          identity-id: "5f0ad8b7-0224-48ca-b233-abbd59f2eb68"
          project-slug: "berliner-schnauze"
          env-slug: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
          domain: "https://infisical.kasimir.dev"

      - name: Setup pnpm 🛠️
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: website/dist

      # Step-level env wins over what the Infisical action exports: the e2e run must never touch a real database.
      - name: Migrate and seed the database
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/bs_e2e
          PAYLOAD_SECRET: e2e-secret
        run: |
          NODE_ENV=production pnpm --filter payload-app migrate
          pnpm --filter payload-app seed:e2e

      # Started here instead of via Playwright's webServer: in the container the job hung
      # after the last test while Playwright tore the server down. setsid + redirected
      # output detach it from the step so the step can end.
      - name: Start server
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/bs_e2e
          NODE_ENV: production
          PAYLOAD_SECRET: e2e-secret
          PAYLOAD_SERVER_URL: http://localhost:4321
        run: |
          setsid nohup node server/index.mjs > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4321/ping > /dev/null && exit 0
            sleep 1
          done
          cat server.log
          exit 1

      - name: Run Playwright tests (shard ${{ matrix.shard }}/4)
        timeout-minutes: 8
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/4

      # Traces/screenshots/console logs can contain secrets — this repo is public,
      # so GitHub Actions artifacts are downloadable by anyone. Encrypt before
      # upload per https://playwright.dev/docs/ci-intro#properly-handling-secrets.
      # Decrypt locally with:
      #   gpg --decrypt --batch --passphrase "$PLAYWRIGHT_REPORT_PASSPHRASE" \
      #     playwright-report.tar.gz.gpg | tar xz
      - name: Encrypt HTML report
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_REPORT_PASSPHRASE: ${{ secrets.PLAYWRIGHT_REPORT_PASSPHRASE }}
        run: |
          tar czf playwright-report.tar.gz playwright-report/
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$PLAYWRIGHT_REPORT_PASSPHRASE" \
            -o playwright-report.tar.gz.gpg playwright-report.tar.gz
          rm playwright-report.tar.gz

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: website/playwright-report.tar.gz.gpg
          retention-days: 14
