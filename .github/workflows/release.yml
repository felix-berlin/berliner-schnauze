name: Release
on:
  push:
    branches:
      - main
      - beta

permissions:
  id-token: write
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.version.outputs.released }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout ✅
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Fetch secrets from Infisical (root) 🔐
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: "oidc"
          identity-id: "5f0ad8b7-0224-48ca-b233-abbd59f2eb68"
          project-slug: "berliner-schnauze"
          env-slug: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
          domain: "https://infisical.kasimir.dev"

      - name: Fetch secrets from Infisical (/GitHub) 🔐
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: "oidc"
          identity-id: "5f0ad8b7-0224-48ca-b233-abbd59f2eb68"
          project-slug: "berliner-schnauze"
          env-slug: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
          domain: "https://infisical.kasimir.dev"
          secret-path: "/GitHub"

      - name: Setup pnpm 🛠️
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 🛠️
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Remember current version
        run: echo "BEFORE_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GIT_AUTHOR_NAME: ${{ env.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ env.GIT_AUTHOR_EMAIL }}
          GIT_COMMITTER_NAME: ${{ env.GIT_COMMITTER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ env.GIT_COMMITTER_EMAIL }}
        run: npx semantic-release

      # semantic-release's prepareCmd bumps package.json only when it publishes.
      # yes/no, not true/false: Actions drops an output equal to a masked secret value (an Infisical secret is "true").
      - name: Detect new version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "released=$([ "$version" != "$BEFORE_VERSION" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Create Sentry release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ env.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ env.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ env.SENTRY_PROJECT }}
        with:
          environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

  # Separate job, but in this workflow on purpose: it runs on the branch ref
  # (main/beta), so the buildx layer cache (type=gha) is shared across releases —
  # a workflow triggered by the tag/release would get a fresh cache scope per tag.
  docker:
    name: Docker image
    needs: release
    if: needs.release.outputs.released == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout release tag ✅
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Fetch secrets from Infisical 🔐
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: "oidc"
          identity-id: "5f0ad8b7-0224-48ca-b233-abbd59f2eb68"
          project-slug: "berliner-schnauze"
          env-slug: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
          domain: "https://infisical.kasimir.dev"

      - name: Setup pnpm 🛠️
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 🛠️
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # the images run this major (dist/ is built here)
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/felix-berlin/berliner-schnauze
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=beta,enable=${{ github.ref_name == 'beta' }}

      - name: Login to GHCR 🔐
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU 🛠️
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx 🛠️
        uses: docker/setup-buildx-action@v3

      - name: Build and push image 🐳
        uses: docker/build-push-action@v6
        with:
          context: website
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # CMS image: built from source inside Docker (no dist/, no secrets).
      - name: CMS image tags
        id: meta-cms
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/felix-berlin/berliner-schnauze-cms
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=beta,enable=${{ github.ref_name == 'beta' }}

      - name: Build and push CMS image 🐳
        uses: docker/build-push-action@v6
        with:
          context: .
          file: payload/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-cms.outputs.tags }}
          labels: ${{ steps.meta-cms.outputs.labels }}
          cache-from: type=gha,scope=cms
          cache-to: type=gha,mode=max,scope=cms
