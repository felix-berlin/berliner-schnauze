<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Header</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/berliner-schnauze/tokens.css">
<link rel="stylesheet" href="ds/berliner-schnauze/colors_and_type.css">
<link rel="stylesheet" href="ds/berliner-schnauze/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.bs-h a{color:inherit}
.bs-h__brand{display:inline-flex;align-items:center;gap:.625rem;min-height:44px;text-decoration:none;color:var(--color-ink-strong)}
.bs-h__brand:hover{color:var(--color-ink-strong)}
.bs-h__word{font-family:var(--font-display);font-weight:400;line-height:1;letter-spacing:0}
.bs-h__nav{display:flex;align-items:stretch;gap:.25rem}
.bs-h__nav a{display:flex;align-items:center;min-height:64px;padding:0 .75rem;font-size:.9rem;font-weight:700;text-decoration:none;color:var(--color-muted);border-block-end:3px solid transparent;box-sizing:border-box}
.bs-h__nav a:hover{color:var(--color-ink-strong)}
.bs-h__nav a[aria-current="page"]{color:var(--color-ink-strong);border-block-end-color:var(--orange-600)}
.bs-h__search{position:relative;display:flex;align-items:center}
.bs-h__search svg{position:absolute;left:.75rem;color:var(--color-muted);pointer-events:none}
.bs-h__search .c-field{padding-left:2.5rem;border-inline-start:3px solid var(--red-berlin-500)}
.bs-h__kbd{position:absolute;right:.5rem;font-size:.7rem;padding:0 .375rem;border:1px solid var(--rule-card);border-radius:var(--radius-xxs);color:var(--color-muted)}
.bs-h__sugg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.bs-h__sugg a{display:flex;align-items:baseline;gap:.5rem;min-height:44px;padding:.5rem 0;box-sizing:border-box;text-decoration:none;border-block-start:1px dashed var(--rule-inner)}
.bs-h__sugg b{color:var(--color-ink-strong)}
.bs-h__sugg span{color:var(--color-muted);font-size:.85rem}
.bs-h__drawer{display:flex;flex-direction:column;padding:.5rem 1rem 1rem;border-block-start:1px dashed var(--rule-card)}
.bs-h__drawer a,.bs-h__drawer button{font:inherit;letter-spacing:inherit;display:flex;align-items:center;gap:.75rem;min-height:48px;padding:0;background:none;border:0;text-decoration:none;color:var(--color-body);font-size:1.05rem;cursor:pointer;text-align:left}
.bs-h__drawer a[aria-current="page"]{color:var(--color-accent-text);font-weight:700}
.bs-h__drawer svg{color:var(--orange-400);flex-shrink:0}
.bs-h__split{height:0;margin:.5rem 0;border-block-start:1px dashed var(--rule-inner)}
.bs-h__drawer a:focus-visible,.bs-h__drawer button:focus-visible,.bs-h__nav a:focus-visible,.bs-h__brand:focus-visible{outline:2px dashed var(--orange-400);outline-offset:2px}
</style>
</helmet>
<header class="bs-h" data-theme="{{theme}}" style="font-family: var(--font-body); letter-spacing: 1px; color: var(--color-body); background: var(--surface-paper); box-shadow: var(--paper-lift); position: relative; z-index: 6;">

<sc-if value="{{isMobile}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; height: 56px; padding: 0 0.5rem 0 1rem;">
<a class="bs-h__brand" href="#" aria-label="Berliner Schnauze, zur Startseite"><img src="ds/berliner-schnauze/assets/logo.svg" alt="" width="32" height="32" style="display: block; border-radius: var(--radius-sm);"><span class="bs-h__word" style="font-size: 1.35rem;">Berliner Schnauze</span></a>
<span style="display: flex;">
<button class="c-icon-button" aria-label="Suche" aria-expanded="{{searchOpen}}" onClick="{{toggleSearch}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg></button>
<button class="c-icon-button" aria-label="Menü" aria-expanded="{{menuOpen}}" onClick="{{toggleMenu}}">
<sc-if value="{{menuClosed}}" hint-placeholder-val="{{true}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg></sc-if>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></sc-if>
</button>
</span>
</div>

<sc-if value="{{searchOpen}}" hint-placeholder-val="{{false}}">
<div role="search" style="display: flex; flex-direction: column; gap: 0.25rem; padding: 0 1rem 0.75rem;">
<label class="bs-h__search"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Suche nach einem Berliner Wort</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><input class="c-field" type="search" value="kn" placeholder="Durchsuche den Berliner-Jargon"></label>
<ul class="bs-h__sugg" aria-label="Vorschläge">
<sc-for list="{{suggestions}}" as="sg" hint-placeholder-count="3"><li><a href="#"><b>{{sg.w}}</b><span>᛫ {{sg.t}}</span></a></li></sc-for>
</ul>
</div>
</sc-if>

<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<nav class="bs-h__drawer" aria-label="Hauptmenü">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5"><a href="#" aria-current="{{n.current}}">{{n.label}}</a></sc-for>
<span class="bs-h__split" aria-hidden="true"></span>
<a href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Wort vorschlagen</a>
<button onClick="{{toggleTheme}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>{{themeLabel}}</button>
<button><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path><path d="M12 15V3"></path></svg>App installieren</button>
</nav>
</sc-if>
</sc-if>

<sc-if value="{{isDesktop}}" hint-placeholder-val="{{false}}">
<div style="box-sizing: border-box; max-width: 1160px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 2rem; height: 64px;">
<a class="bs-h__brand" href="#" aria-label="Berliner Schnauze, zur Startseite"><img src="ds/berliner-schnauze/assets/logo.svg" alt="" width="36" height="36" style="display: block; border-radius: var(--radius-sm);"><span class="bs-h__word" style="font-size: 1.6rem;">Berliner Schnauze</span></a>
<nav class="bs-h__nav" aria-label="Hauptmenü">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5"><a href="#" aria-current="{{n.current}}">{{n.label}}</a></sc-for>
</nav>
<span style="margin-left: auto; display: flex; align-items: center; gap: 0.5rem;">
<label class="bs-h__search" role="search" style="width: 260px;"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Suche nach einem Berliner Wort</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><input class="c-field" type="search" placeholder="Durchsuche den Jargon"><kbd class="bs-h__kbd">/</kbd></label>
<button class="c-icon-button" aria-label="{{themeLabel}}" onClick="{{toggleTheme}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></button>
<a class="c-textlink" href="#" style="white-space: nowrap;">Wort vorschlagen</a>
</span>
</div>
</sc-if>

</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"size":{"editor":"enum","options":["mobile","desktop"],"default":"mobile"},"current":{"editor":"enum","options":["wort","index","trend","spiele","magazin"],"default":"wort"},"startOpen":{"editor":"enum","options":["nichts","suche","menue"],"default":"nichts"},"$preview":{"width":390,"height":480}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: props.startOpen === 'suche' ? 'search' : props.startOpen === 'menue' ? 'menu' : null };
  }
  renderVals() {
    const { open } = this.state;
    const cur = this.props.current ?? 'wort';
    const items = [['index', 'Wort-Index'], ['trend', 'Im Trend'], ['spiele', 'Spiele'], ['magazin', 'Magazin']];
    return {
      theme: this.props.theme ?? 'dark',
      isMobile: (this.props.size ?? 'mobile') === 'mobile',
      isDesktop: this.props.size === 'desktop',
      nav: items.map(([id, label]) => ({ label, current: cur === id ? 'page' : 'false' })),
      searchOpen: open === 'search',
      menuOpen: open === 'menu', menuClosed: open !== 'menu',
      toggleSearch: () => this.setState({ open: open === 'search' ? null : 'search' }),
      toggleMenu: () => this.setState({ open: open === 'menu' ? null : 'menu' }),
      themeLabel: (this.props.theme ?? 'dark') === 'dark' ? 'Helles Design' : 'Dunkles Design',
      toggleTheme: () => {},
      suggestions: [{ w: 'Knorke', t: 'großartig, toll' }, { w: 'Knülle', t: 'betrunken' }, { w: 'Knast', t: 'Gefängnis' }]
    };
  }
}
</script>
</body>
</html>
